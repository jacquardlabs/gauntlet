name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Contiguous, floor to current: 3.9 because these scripts ship to
        # consuming projects and run on whatever `python3` is there (stock macOS
        # is 3.9.6), through 3.14. Sampling only the ends would miss a stdlib
        # removal that lands in a middle version, and each leg costs ~15s.
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: |
          for t in tests/test_*.py; do
            echo "== $t"
            python3 "$t"
          done

  independence:
    name: judge independence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Every registered judge stays a judge
        run: python3 scripts/check_independence.py
      - name: Plugin manifest
        run: python3 scripts/validate_plugin.py

  lint:
    name: ruff + version floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Ruff
        run: uv run --no-project --with ruff==0.16.0 ruff check scripts tests
      - name: Runtime version floor for shipped scripts
        run: uv run --no-project --with vermin==1.8.0 vermin --no-tips -t=3.9- scripts/
