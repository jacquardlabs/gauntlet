name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor: these scripts ship to consuming projects and run on
        # whatever `python3` is there, which on stock macOS is 3.9.
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: |
          for t in tests/test_*.py; do
            echo "== $t"
            python3 "$t"
          done

  independence:
    name: judge independence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Every registered judge stays a judge
        run: python3 scripts/check_independence.py

  lint:
    name: ruff + version floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff
        run: uv run --no-project --with ruff==0.16.0 ruff check scripts tests
      - name: Runtime version floor for shipped scripts
        run: uv run --no-project --with vermin==1.8.0 vermin --no-tips -t=3.9- scripts/
